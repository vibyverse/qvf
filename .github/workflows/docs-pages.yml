# Builds the documentation site (mkdocs.yml, Doxygen C++/C reference) and
# deploys it to GitHub Pages. Publication is a maintainer action: the
# workflow runs only when dispatched by hand. See CONTRIBUTING.md
# "Publishing the documentation site" for the one-time repository settings.
name: Docs site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install Doxygen and the docs toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen
          python -m pip install -r scripts/requirements-docs.txt
      - name: Build (strict)
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
      # site_url (mkdocs.yml) places the site under docs/ of the Pages base
      # URL, so the artifact keeps that path. The root page forwards to it,
      # and Pages serves the root 404.html for any missing path.
      - name: Arrange the Pages artifact
        run: |
          mkdir -p _pages
          cp -r "$RUNNER_TEMP/site" _pages/docs
          cp _pages/docs/404.html _pages/404.html
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>QVF documentation</title>' \
            '<meta http-equiv="refresh" content="0; url=docs/">' \
            '<link rel="canonical" href="docs/"><p><a href="docs/">QVF documentation</a></p>' \
            > _pages/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}docs/
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
