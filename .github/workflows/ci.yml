# Release-candidate qualification for the canonical GitHub repository.
name: CI

on:
  push:
    branches: ['release-candidate/**']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer push or PR update cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The reference Python writer/reader and the packaging invariants.
  python:
    if: startsWith(github.ref, 'refs/heads/release-candidate/')
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest supported (requires-python), 3.14 the newest.
        # If the runner image ever lacks 3.14, use 3.13 here and say so.
        # Test the supported Python version boundaries.
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Privacy hook self-test
        run: python .githooks/test_privacy_hook.py -q
      - name: Install
        run: pip install -e "python/[numpy,validate]" pytest
      # Keep the oldest Python endpoint free of the optional chemistry engine.
      # Exercise the accepted minimum PySCF version.
      - name: Install PySCF adapter dependencies
        if: matrix.python-version == '3.14'
        run: pip install --only-binary=pyscf -e "python/[pyscf]" "pyscf==2.14.0"
      - name: Tests
        run: python -m pytest python/tests -q

  # test_conformance.py includes the positive, negative and legacy corpora;
  # no second Python environment/job is needed for the same reference runner.

  # Zero-dependency C++17 library: build and test on every platform with
  # warnings as errors. Warning flags go in through CXXFLAGS (not
  # -DCMAKE_CXX_FLAGS) so CMake keeps its own MSVC defaults such as /EHsc.
  cpp:
    if: startsWith(github.ref, 'refs/heads/release-candidate/')
    name: cpp (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            cxxflags: -Wall -Wextra -Werror
          - name: ubuntu-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            cxxflags: -Wall -Wextra -Werror
          - name: macos-clang
            os: macos-latest
            cxxflags: -Wall -Wextra -Werror
          - name: windows-msvc
            os: windows-latest
            cxxflags: /W4 /WX
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CXXFLAGS: ${{ matrix.cxxflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python validator and array checks
        run: pip install "python/[numpy,validate]"
      - name: Install optional Fortran compiler
        if: matrix.name == 'ubuntu-gcc'
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Configure
        if: matrix.name != 'ubuntu-gcc'
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure with Fortran checks
        if: matrix.name == 'ubuntu-gcc'
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release -DQVF_FORTRAN=ON -DPython3_EXECUTABLE="$(command -v python)" "-DCMAKE_Fortran_FLAGS=-fcheck=all -Wall -Wextra -Werror"
      # --config / -C matter for multi-config generators (Visual Studio) and
      # are ignored by single-config ones.
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Python validates the C API examples
        shell: bash
        run: |
          bindir=build
          [ -f "$bindir/write_all_kinds_c" ] || bindir=build/Release
          python scripts/check_c_api_examples.py --writer "$bindir/write_all_kinds_c" --reader "$bindir/read_qvf_c" --output "$RUNNER_TEMP/qvf-c-api-roundtrip"
      # CTest already includes both conformance modes (with/without schema).

  # The same C++ build and tests under AddressSanitizer + UndefinedBehavior-
  # Sanitizer, then the C++ reader over every conformance archive.
  # -fno-sanitize-recover makes an UBSan finding fail the job rather than only
  # print a diagnostic.
  sanitizers:
    if: startsWith(github.ref, 'refs/heads/release-candidate/')
    name: sanitizers (clang, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g
      CXXFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # ctest also ran the conformance runner (qvf_conformance) under the
      # sanitizers; this reads every positive archive, zip64.qvf and
      # data_descriptor.qvf included.
      - name: Read every conformance archive
        run: |
          status=0
          for f in conformance/corpus/*.qvf; do
            echo "== $f"
            ./build/read_qvf "$f" || status=1
          done
          exit $status

  # cpp/qvf_single.hpp is generated; a stale copy silently diverges from the
  # sources an adopter would otherwise vendor.
  js:
    if: startsWith(github.ref, 'refs/heads/release-candidate/')
    name: JavaScript reader (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest/newest supported versions; GitLab covers Node 22.
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
        working-directory: js
      # npm test builds/typechecks src once; scripts have a separate TS project.
      - run: npm test
        working-directory: js
      - run: npx tsc -p tsconfig.scripts.json
        working-directory: js

  amalgamation:
    if: startsWith(github.ref, 'refs/heads/release-candidate/')
    name: amalgamation up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check
        run: python scripts/amalgamate.py --check
      # The tables generated from the schema (C++, TypeScript, Python) must
      # match it: python scripts/gen_kinds.py regenerates them.
      - name: Generated tables up to date
        run: python scripts/gen_kinds.py --check
      - name: Fortran C ABI bindings up to date
        run: python scripts/gen_fortran.py --check

  # The Rust crate (WP-61) on stable and on its declared MSRV. fmt and clippy
  # run on stable only, since lints differ between toolchains. The writer
  # tests cross-check with the Python reference validator, so it is installed.
  rust:
    if: startsWith(github.ref, 'refs/heads/release-candidate/')
    name: rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep "msrv" equal to rust-version in rust/Cargo.toml (checked below).
        include:
          - toolchain: stable
          - toolchain: "1.74"
            msrv: true
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the Python reference validator
        working-directory: .
        run: pip install "python/[numpy,validate]"
      - name: MSRV matches Cargo.toml
        if: matrix.msrv
        run: |
          declared="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          if [ "$declared" != "${{ matrix.toolchain }}" ]; then
            echo "::error::rust-version is '$declared' but the MSRV job uses ${{ matrix.toolchain }}"
            exit 1
          fi
      - name: Install toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustc --version
      - name: Format
        if: ${{ !matrix.msrv }}
        run: cargo fmt --check
      - name: Clippy
        if: ${{ !matrix.msrv }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        env:
          PYTHON: python
        run: cargo test --locked

  # The generated schema checkers (C++ tool and JavaScript twin) against
  # jsonschema in Python, all three in one job. The test skips a checker it
  # cannot find, so the job fails on any skip.
  parity:
    if: startsWith(github.ref, 'refs/heads/release-candidate/')
    name: schema-checker parity (Python, Node, C++)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install Python
        run: pip install -e "python/[numpy,validate]" pytest
      - name: Build C++
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Build JavaScript
        working-directory: js
        run: |
          npm ci
          npm run build
      - name: Parity test
        run: |
          QVF_CPP_BUILD_DIR="$PWD/build" QVF_NODE="$(command -v node)" \
            python -m pytest python/tests/test_schema_checker_parity.py -v -rs \
            --junitxml="$RUNNER_TEMP/parity.xml"
      - name: No checker skipped
        run: |
          python - "$RUNNER_TEMP/parity.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"parity: {tests} tests, {skipped} skipped")
          if tests == 0 or skipped:
              sys.exit("a schema checker was skipped or no test ran")
          PY

  # Bounded libFuzzer smoke run (WP-50): each C++ target for FUZZ_SECONDS
  # over the corpus seeds, under ASan + UBSan (QVF_FUZZ=ON). A crash, leak,
  # timeout or sanitizer report fails the job, and the reproducers are
  # uploaded. The libFuzzer runtime is required, not the standalone driver.
  fuzz:
    if: startsWith(github.ref, 'refs/heads/release-candidate/')
    name: fuzz smoke (libFuzzer, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
      FUZZ_SECONDS: "180"
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install clang and the libFuzzer runtime
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: Configure
        run: |
          cmake -S cpp -B build/fuzz -DCMAKE_BUILD_TYPE=Debug -DQVF_FUZZ=ON
          if ! grep -q '^QVF_HAVE_LIBFUZZER:INTERNAL=1$' build/fuzz/CMakeCache.txt; then
            echo "::error::clang has no libFuzzer runtime"
            exit 1
          fi
      - name: Build
        run: cmake --build build/fuzz --parallel --target zip_reader_fuzzer manifest_fuzzer
      - name: Seeds
        run: |
          mkdir -p build/fuzz/corpus build/fuzz/manifest_corpus \
            build/fuzz/artifacts/zip_reader build/fuzz/artifacts/manifest
          python scripts/fuzz_manifest_seeds.py build/fuzz/manifest_seeds \
            conformance/corpus conformance/negative conformance/legacy
      # libFuzzer adds new inputs to the first directory only.
      - name: zip_reader_fuzzer
        id: zip_reader
        run: |
          ./build/fuzz/zip_reader_fuzzer -max_total_time="$FUZZ_SECONDS" -max_len=65536 \
            -timeout=30 -rss_limit_mb=2048 -print_final_stats=1 \
            -artifact_prefix=build/fuzz/artifacts/zip_reader/ \
            build/fuzz/corpus conformance/corpus conformance/negative conformance/legacy
      - name: manifest_fuzzer
        if: ${{ !cancelled() && steps.zip_reader.outcome != 'skipped' }}
        run: |
          ./build/fuzz/manifest_fuzzer -max_total_time="$FUZZ_SECONDS" -max_len=262144 \
            -timeout=30 -rss_limit_mb=2048 -print_final_stats=1 \
            -artifact_prefix=build/fuzz/artifacts/manifest/ \
            build/fuzz/manifest_corpus build/fuzz/manifest_seeds
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: build/fuzz/artifacts/
          if-no-files-found: ignore

  # Big-endian check (WP-50): cross-build for s390x, run CTest under QEMU
  # user-mode emulation (CMAKE_CROSSCOMPILING_EMULATOR), then write archives on
  # the emulated and the native host and compare them with the Python
  # validator and bit for bit.
  s390x:
    if: startsWith(github.ref, 'refs/heads/release-candidate/')
    name: big-endian (s390x under QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install cross toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y g++-s390x-linux-gnu qemu-user
      - name: Install Python validator
        run: pip install "python/[numpy,validate]"
      - name: Cross-build
        run: |
          cmake -S cpp -B build/s390x -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cpp/cmake/toolchains/s390x-linux-gnu.cmake"
          cmake --build build/s390x --parallel
      - name: CTest under QEMU
        run: ctest --test-dir build/s390x --output-on-failure
      - name: Native build
        run: |
          cmake -S cpp -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel
      - name: Cross-host round trip
        run: |
          mkdir -p build/endian/be build/endian/le
          qemu-s390x -L /usr/s390x-linux-gnu build/s390x/qvf_endian_probe write build/endian/be/endian_probe.qvf
          build/native/qvf_endian_probe write build/endian/le/endian_probe.qvf
          for t in write_all_kinds write_h2o write_h2o_c; do
            (cd build/endian/be && qemu-s390x -L /usr/s390x-linux-gnu "../../s390x/$t" "$t.qvf")
            (cd build/endian/le && "../../native/$t" "$t.qvf")
          done
          python scripts/check_endian_roundtrip.py build/endian/be --reference build/endian/le
